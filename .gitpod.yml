github:
  prebuilds:
    addBadge: true
    addCheck: prevent-merge-on-error
    master: true
    pullRequests: true

vscode:
  extensions:
    - biomejs.biome
    - bpruitt-goddard.mermaid-markdown-syntax-highlighting
    - editorconfig.editorconfig
    - ms-python.python
    - tombi-toml.tombi

ports:
  # Mkdocs local server; start it with `poe docs`
  - port: 8000
    onOpen: notify

tasks:
  - init: mise trust && mise install && uv run poe dev-setup
