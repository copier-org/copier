name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:
  push:
    branches: ["master"]
permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=mise packageName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: "2026.11.12"

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install mise
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}

      # Autoformat and try to push back changes
      - run: prek run -a --show-diff-on-failure
        continue-on-error: true
      # HACK https://github.com/autofix-ci/action/pull/15
      - run: prek uninstall -t pre-commit -t commit-msg
      - uses: autofix-ci/action@v1.3
        with:
          commit-message: "style: autoformat with prek"
