name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pytest_addopts:
        description:
          Extra options for pytest; use -vv for full details; see
          https://docs.pytest.org/en/latest/example/simple.html#how-to-change-command-line-options-defaults
        required: false

env:
  LANG: "en_US.utf-8"
  LC_ALL: "en_US.utf-8"
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit
  PYTHONIOENCODING: "UTF-8"
  # renovate: datasource=github-releases depName=mise packageName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: "2026.11.12"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_ADDOPTS:
        --cov=./ --cov-report=xml ${{ github.event.inputs.pytest_addopts }}
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needs all tags to compute dynamic version
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Run pytest
        run: mise run test
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        env:
          OS: ${{ matrix.os }}
          PYTHON: ${{ matrix.python-version }}
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          file: ./coverage.xml
          flags: unittests
          name: copier
          token: ${{ secrets.CODECOV_TOKEN }}

  mise:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Allow pushing back pre-commit changes
    steps:
      - uses: actions/checkout@v7
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: uv run copier --version
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: mise run test
