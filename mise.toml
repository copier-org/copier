[settings]
experimental = true
lockfile = true

[tools]
biome = "2.6.9"
difftastic = "0.71.0"
editorconfig-checker = "4.0.2"
"conda:git" = "2.56.0"
prek = "0.5.11"
rumdl = "0.3.2"
tombi = "1.11.3"
typos = "1.52.2"
uv = "0.13.4"

[deps.uv]
auto = true
run = "uv sync --locked --group compat-{{ vars.resolution }}"

[env]
GIT_EXTERNAL_DIFF = "difft"

[vars]
resolution = "highest"

[tasks.changelog]
description = "Prepend a release section for unreleased changes to CHANGELOG.md"
run = "git-cliff --unreleased --bump --prepend CHANGELOG.md"

[tasks.changelog.env]
GIT_CLIFF_OFFLINE = "{% if get_env(name='GITHUB_TOKEN', default='') == '' %}true{% else %}false{% endif %}"

[tasks.changelog.tools]
git-cliff = "2.14.2"

[tasks.test]
description = "Run tests"
run = "uv run --no-sync poe test"

[tasks.test.env]
GIT_AUTHOR_EMAIL = "copier@example.com"
GIT_AUTHOR_NAME = "copier"
GIT_COMMITTER_EMAIL = "copier@example.com"
GIT_COMMITTER_NAME = "copier"
PYTHONOPTIMIZE = ""
